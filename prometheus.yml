global:
  scrape_interval: 15s

scrape_configs:
  - job_name: events-service
    static_configs:
      - targets: ["eventservice:5001"]
    metrics_path: /metrics

  - job_name: bookings-service
    static_configs:
      - targets: ["bookingservice:5002"]
    metrics_path: /metrics

  - job_name: users-service
    static_configs:
      - targets: ["userservice:5000"]
    metrics_path: /metrics
